<!doctype html>
<html lang="zh-CN">

<head>
    <meta name="ha-bridge-release" content="8b3528fb02ef4fb48b30643ae9e57797">
    <meta charset="utf-8">
    <script src="/bridge-static/js/shared/client-log.js?v=20260905-client-log-v1"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#172029">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HA Bridge">
    <title>初始化 · HA Bridge</title>
    <link rel="icon" href="/bridge-static/assets/brand/ha-bridge-favicon-h5.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/bridge-static/assets/brand/ha-bridge-favicon-h5.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/bridge-static/assets/brand/ha-bridge-icon-180-h5.png" sizes="180x180">
    <link rel="apple-touch-icon-precomposed" href="/bridge-static/assets/brand/ha-bridge-icon-180-h5.png" sizes="180x180">
    <link rel="manifest" href="/bridge-static/assets/manifests/manifest-h5.webmanifest">
    <link rel="stylesheet" href="/bridge-static/css/auth/auth.css?v=20260726-brand-v1-20260905-account-reset-v1">
</head>

<body>
    <main class="login-shell">
        <section class="login-showcase" aria-label="HA Bridge介绍">
            <div class="showcase-grid" aria-hidden="true"></div>
            <div class="showcase-orb orb-one" aria-hidden="true"></div>
            <div class="showcase-orb orb-two" aria-hidden="true"></div>
            <div class="showcase-brand"><img class="brand-mark"
                    src="/bridge-static/assets/brand/ha-bridge-mark-black-orange.svg?v=20260726-h2" alt=""><span>HA Bridge</span>
            </div>
            <div class="home-characters" aria-hidden="true">
                <div class="character character-orange"><i></i><i></i></div>
                <div class="character character-purple"><i></i><i></i></div>
                <div class="character character-dark"><i></i><i></i></div>
                <div class="character character-yellow"><i></i><i></i><span class="character-mouth yellow-mouth"></span>
                </div>
            </div>
        </section>
        <section class="login-panel">
            <div class="mobile-brand"><img class="brand-mark"
                    src="/bridge-static/assets/brand/ha-bridge-mark-white-orange.svg?v=20260726-h2" alt=""><span>HA Bridge</span>
            </div>
            <div class="login-card">
                <header>
                    <p class="eyebrow">FIRST SETUP · 0.5.0</p>
                    <h1>设置管理员</h1>
                    <p>首次安装或重置账号后，在这里设置管理员账号和密码。</p>
                </header>
                <form id="setup-form" class="auth-form"> <label><span>管理员账号</span><input name="username"
                            placeholder="输入管理员账号" autocomplete="username" minlength="3" maxlength="64" required></label>
                    <label><span>密码</span><span class="token-field"><input id="setup-password" name="password"
                                type="password" placeholder="至少8个字符" autocomplete="new-password" minlength="8"
                                maxlength="256" required><button data-toggle-password="setup-password" type="button"
                                aria-label="显示密码" title="显示密码"><svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" />
                                    <circle cx="12" cy="12" r="2.5" />
                                </svg></button></span></label> <label><span>再次输入密码</span><span
                            class="token-field"><input id="setup-password-confirmation" name="passwordConfirmation"
                                type="password" placeholder="再次输入密码" autocomplete="new-password" minlength="8"
                                maxlength="256" required><button data-toggle-password="setup-password-confirmation"
                                type="button" aria-label="显示密码" title="显示密码"><svg viewBox="0 0 24 24"
                                    aria-hidden="true">
                                    <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" />
                                    <circle cx="12" cy="12" r="2.5" />
                                </svg></button></span></label>
                    <p id="message" class="login-error" role="alert" hidden></p> <button class="login-submit"
                        type="submit"><span>保存账号并进入系统</span><b>→</b></button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="/bridge-static/js/auth/auth-shell.js"></script>
    <script type="module" src="/bridge-static/js/auth/setup.js"></script>
</body>

</html>
