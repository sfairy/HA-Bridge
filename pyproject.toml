[project]
name = "ha-bridge"
version = "0.5.3"
description = "Home Assistant dashboard and control bridge"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/app", "register"]

[tool.ruff]
# Conservative baseline: report only, no blanket auto-fixes.
line-length = 120
target-version = "py311"
extend-exclude = [
    ".venv",
    "data",
    "register/data",
    "backend/app/__pycache__",
    "migrations/__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/variables, undefined names)
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by the formatter
    "B008",  # FastAPI Depends()/Query() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E402", "F401"]
"migrations/env.py" = ["E402"]
# sys.path bootstrapping before imports is intentional in these entry points.
"start.py" = ["E402"]
"container_entrypoint.py" = ["E402"]
"backend/app/main.py" = ["E402"]
